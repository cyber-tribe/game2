<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#362d1e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" href="/icons/icon-192.png" />
    <title>game2</title>
    <style>
      /*
       * Shared color vocabulary — mirrors src/render/palette.ts's
       * GAME_PALETTE (kept in sync by hand since CSS can't import a TS
       * module). See plan/archived/0084-original-ui-foundation.md: this replaces
       * the project's original navy/blue "modern web app" look with a
       * stone/bronze temple-relief one, per the SFC Populous 2 fidelity
       * effort — border-radius, rgba glass panels, and gradients are
       * deliberately avoided in favor of hard-edged 3-4 step bevels.
       */
      :root {
        /* BEGIN GENERATED PALETTE — edit tools/palette.json, then run `npm run palette` */
        --stone-highlight: #c4c492;
        --stone-light: #a1916f;
        --stone-mid: #7f6f4d;
        --stone-dark: #6a5a3e;
        --stone-shadow: #4d3c34;
        --bronze-light: #c4801b;
        --bronze-mid: #8c6a2c;
        --bronze-dark: #3a2c20;
        --parchment: #c4c492;
        --ink: #24200f;
        --ink-faded: #4d3c34;
        --player-accent: #235ebc;
        --enemy-accent: #b5352f;
        --mana-accent: #6a4fc0;
        --warning: #b5352f;
        /* END GENERATED PALETTE */

        /* Read in main.ts to keep the HUD/map clear of the status bar —
           installed standalone (viewport-fit=cover) it's the notch/status
           bar height; in an ordinary browser tab it's 0, since the
           browser's own chrome already occupies that space. */
        --safe-area-inset-top: env(safe-area-inset-top, 0px);
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--stone-shadow);
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        font-family: "Courier New", ui-monospace, monospace;
      }

      #app {
        position: absolute;
        inset: 0;
      }

      /*
       * A single fixed-size stone command panel replacing the old
       * scrollable HTML toolbar — per feedback: "メニューボタンが増えすぎて
       * 操作するマップ画面が小さいです" led to a scrolling toolbar before,
       * but scrolling itself reads as a "settings screen", not a game
       * command bar (see plan/0084). This sizes to its own content instead
       * of capping+scrolling: the icon grid below is deliberately dense
       * enough (small icons, no per-button subtitle text) to fit a phone
       * screen without needing to scroll.
       */
      #command-panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
        background: var(--stone-mid);
        border-top: 3px solid var(--bronze-dark);
        box-shadow: inset 0 2px 0 var(--stone-light);
        box-sizing: border-box;
      }

      /*
       * The single in-panel line messages appear on — replaces the old
       * floating pill toasts (#enemy-event-toast/#entity-info-panel), per
       * "画面中央に現代的なfloating toastを出す方式を減らす". Height is
       * always reserved (visibility, not display) so a message appearing/
       * disappearing never reflows the icon grid beneath it.
       */
      #panel-message {
        min-height: 16px;
        padding: 3px 8px;
        background: var(--parchment);
        border: 2px solid var(--bronze-dark);
        box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.35), inset -1px -1px 0 var(--stone-shadow);
        color: var(--ink);
        font-size: 12px;
        text-align: center;
        box-sizing: border-box;
        visibility: hidden;
      }

      #panel-message.visible {
        visibility: visible;
      }

      #panel-message.warning {
        color: var(--warning);
        font-weight: bold;
      }

      #status-row {
        display: flex;
        gap: 6px;
      }

      .status-item {
        flex: 1 1 0;
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
        padding: 3px 5px;
        background: var(--stone-dark);
        border: 2px solid var(--bronze-dark);
        box-shadow: inset 1px 1px 0 var(--stone-mid);
        box-sizing: border-box;
      }

      .status-icon {
        flex: none;
        width: 16px;
        height: 16px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      .status-bar-track {
        flex: 1 1 auto;
        min-width: 0;
        height: 10px;
        display: flex;
        background: var(--stone-shadow);
        border: 1px solid var(--bronze-dark);
        overflow: hidden;
      }

      #mana-bar-fill {
        height: 100%;
        background: var(--mana-accent);
      }

      #population-bar-player {
        height: 100%;
        background: var(--player-accent);
      }

      #population-bar-enemy {
        height: 100%;
        background: var(--enemy-accent);
      }

      .status-value {
        flex: none;
        font-size: 11px;
        color: var(--parchment);
        min-width: 2.2em;
        text-align: right;
      }

      /*
       * The command icon grid itself. auto-fill + a fixed minmax keeps
       * every button the same size and wraps to as many rows as needed —
       * dense rather than the old one-row-per-category layout with its own
       * label/subtitle line, per "情報密度" and "スクロールを基本的に
       * 使用しない".
       */
      #toolbar {
        display: flex;
        flex-direction: column;
      }

      .command-row {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
        gap: 4px;
      }

      /*
       * `display: grid` above outranks the browser's own [hidden] rule
       * (same specificity, ours comes later), so without this the five
       * schools that are meant to be put away render anyway — the whole
       * panel, exactly what these categories exist to avoid.
       */
      .command-row[hidden] {
        display: none;
      }

      /* A thin bronze rule separates "常時発動できる方針" from "奇跡" without needing a labeled section header. */
      .command-row.tool-group {
        margin-top: 4px;
        padding-top: 5px;
        border-top: 2px solid var(--bronze-dark);
      }

      /*
       * The six schools (see src/ui/miracleCategories.ts). Narrower than a
       * command button because each holds one or two characters, and it
       * lets all six sit on one line at any phone width; the school's own
       * miracles then get the full-width row below it.
       */
      .command-row.category-row {
        grid-template-columns: repeat(6, 1fr);
        margin-top: 4px;
        padding-top: 5px;
        border-top: 2px solid var(--bronze-dark);
      }

      .category-button {
        min-height: 30px;
        font-size: 12px;
      }

      /* The selected school reads as the row's own tab, not as a pressed tool. */
      .category-button[aria-pressed="true"] {
        background: var(--bronze-mid);
      }

      /*
       * auto-*fit*, unlike the auto-fill the other rows use: a school has
       * four or five miracles, so auto-fill would lay out nine 46px
       * columns and leave half the row empty with 「集結地移動」 wrapped
       * onto three lines in a narrow button. Collapsing the empty tracks
       * lets the four or five buttons that exist share the row's whole
       * width instead, which is also what keeps a school to one line.
       */
      .command-row.miracle-group {
        grid-template-columns: repeat(auto-fit, minmax(46px, 1fr));
        margin-top: 4px;
      }

      .command-button {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        min-height: 44px;
        padding: 3px 2px;
        font-family: inherit;
        font-size: 9px;
        line-height: 1.15;
        background: var(--stone-mid);
        border: 2px solid var(--bronze-dark);
        box-shadow: inset 1px 1px 0 var(--stone-light), inset -1px -1px 0 var(--stone-shadow);
        color: var(--ink);
        -webkit-tap-highlight-color: transparent;
      }

      .command-button canvas.pixel-icon {
        width: 22px;
        height: 22px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      .command-button[aria-pressed="true"] {
        background: var(--bronze-mid);
        box-shadow: inset 1px 1px 0 var(--bronze-light), inset -1px -1px 0 var(--stone-shadow);
        color: var(--parchment);
        font-weight: bold;
      }

      /*
       * A terrain-edit direction this match's TerrainEditRule forbids
       * (see world/heightmap.ts) — main.ts disables that button outright
       * rather than letting a tap silently do nothing.
       */
      .command-button:disabled {
        opacity: 0.35;
      }

      /*
       * The player's current mana can't cover this button's cost right now
       * (main.ts's updateToolbarAffordability, re-evaluated every frame as
       * mana rises/falls) — dimmed but, unlike :disabled above, still
       * tappable: a tap still gives the clearer message in #panel-message,
       * and raise/lower must stay selectable even while unaffordable.
       */
      .command-button.mana-low {
        opacity: 0.55;
      }

      /* A themed focus ring (bronze, not the browser's default blue) rather than none — keeps keyboard/PC focus visible without clashing with the stone palette. */
      .command-button:focus-visible {
        outline: 2px solid var(--bronze-light);
        outline-offset: 1px;
      }

      /*
       * A one-time nudge toward the game's core loop — flatten the land
       * right around your own walkers/houses to grow them — since the
       * PIXI-canvas HUD is deliberately status-only and otherwise a
       * first-time player has no in-game explanation of what to do first.
       * Positioned just above the command panel; main.ts sets its `bottom`
       * alongside the map's own layout() so it never overlaps the panel
       * regardless of how many rows the icon grid wraps to.
       */
      #tutorial-hint {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: 320px;
        padding: 8px 12px;
        background: var(--parchment);
        border: 2px solid var(--bronze-dark);
        box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.35), inset -1px -1px 0 var(--stone-shadow);
        color: var(--ink);
        font-size: 13px;
        line-height: 1.5;
        box-sizing: border-box;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.5s ease;
        z-index: 5;
      }

      #tutorial-hint.hidden {
        opacity: 0;
      }

      /*
       * 情報パネル (see docs/game-system.md 11節: タップしたウォーカー・家を
       * 照会). The post-game "戦いの記録" recap (see main.ts's
       * showMatchRecord). A PixiJS Text object (used for the rest of the
       * HUD) can't scroll, and a long match can produce more event lines
       * than fit on screen — an HTML overlay gets real scrolling for free.
       * Shown once, when the match ends; there's no way to dismiss it since
       * the match is over and nothing else happens after this.
       */
      /*
       * 征服モードの簡易版（docs/game-system.md 10節）: 500ワールドの
       * 進行やパスワード継続はまだ実装しないが、地形タイプ・マップサイズ・
       * 地形操作制限が異なる固定の少数ワールドから選ぶ最初の一歩として、
       * 起動直後に必ずこの画面を経由する。#match-recordと同じ
       * 「中央固定のスクロール可能パネル」構造を流用している。
       */
      #world-select {
        position: fixed;
        left: 10px;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        max-height: 80vh;
        display: flex;
        flex-direction: column;
        background: var(--stone-mid);
        border: 3px solid var(--bronze-dark);
        box-shadow: inset 0 2px 0 var(--stone-light);
        padding: 14px;
        box-sizing: border-box;
        color: var(--ink);
        z-index: 9;
      }

      #world-select.hidden {
        display: none;
      }

      #world-select-title {
        flex: none;
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 4px;
      }

      /*
        Who the player is — 「プレイヤーは『ゼウスと人間の女性の間に生まれた
        青年』という設定」. The world select is the campaign's front door and
        the only screen that ever shows the whole roster of gods, so it is
        where the premise belongs. Quieter than the title: it is read once.
      */
      /* 奇跡のレベル — the six schools the password carries in. Sits
         between the premise and the world list because it describes the god
         choosing, not the world chosen. Hidden entirely at level 1 in every
         school: a row of ones on a fresh start is noise. */
      #world-select-levels {
        flex: none;
        font-size: 11px;
        line-height: 1.7;
        color: var(--ink);
        letter-spacing: 0.04em;
      }
      #world-select-levels:empty {
        display: none;
      }

      #world-select-premise {
        flex: none;
        font-size: 12px;
        line-height: 1.7;
        /* Full ink, like the title. The panel field is mid-stone, so both
           the dim greys that work on the dark map and --ink-faded come out
           around 2:1 against it — legible in a mockup, not on a phone. Size
           and weight already keep this under the title it sits below. */
        color: var(--ink);
        margin-bottom: 10px;
      }

      #world-select-list {
        flex: 1 1 auto;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      #world-select-list button {
        padding: 12px;
        font-size: 14px;
        font-family: inherit;
        text-align: left;
        border: 2px solid var(--bronze-dark);
        background: var(--parchment);
        color: var(--ink);
        -webkit-tap-highlight-color: transparent;
      }

      #world-select-list button .world-select-name {
        display: block;
        font-weight: bold;
        margin-bottom: 2px;
      }

      #world-select-list button .world-select-detail {
        display: block;
        font-size: 12px;
        color: var(--ink-faded);
      }

      #world-select-list button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      /*
       * 征服モードのパスワード継続（docs/game-system.md 10節の
       * 「クリアするとパスワード（ワールド名）が与えられ、そこから
       * 再開できる」）: 前回クリアした際に表示されたパスワードを打ち込むと、
       * そこまでのワールドが選択可能になる。ローカルストレージ等での
       * 自動引き継ぎは行わない — 昔ながらの「紙に書き写して打ち込む」
       * パスワードそのものの体験を再現している。
       */
      #world-select-password-row {
        flex: none;
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }

      #world-select-password-row input {
        flex: 1 1 auto;
        min-width: 0;
        padding: 10px;
        font-size: 14px;
        font-family: inherit;
        border: 2px solid var(--bronze-dark);
        background: var(--parchment);
        color: var(--ink);
        box-sizing: border-box;
      }

      #world-select-password-row button {
        flex: none;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: bold;
        font-family: inherit;
        border: 2px solid var(--bronze-dark);
        background: var(--bronze-mid);
        color: var(--parchment);
        -webkit-tap-highlight-color: transparent;
      }

      #world-select-password-error {
        flex: none;
        margin-top: 6px;
        font-size: 12px;
        color: var(--warning);
      }

      #world-select-password-error.hidden {
        display: none;
      }

      #match-record {
        position: fixed;
        left: 10px;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        max-height: 70vh;
        display: flex;
        flex-direction: column;
        background: var(--stone-mid);
        border: 3px solid var(--bronze-dark);
        box-shadow: inset 0 2px 0 var(--stone-light);
        padding: 14px;
        box-sizing: border-box;
        color: var(--ink);
        z-index: 8;
      }

      #match-record.hidden {
        display: none;
      }

      #match-record-title {
        flex: none;
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      #match-record-list {
        flex: 1 1 auto;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        /* Overrides the page-wide touch-action: none so a finger-drag here
           actually scrolls the list instead of being swallowed as a map gesture. */
        touch-action: pan-y;
        font-size: 13px;
        line-height: 1.7;
      }

      /*
       * Kept pinned below the (scrollable) event list rather than inside
       * it, so it's always visible without scrolling down — see
       * plan/0038-play-again.md. This button is deliberately left in place
       * with no other post-game screen: whether a player presses it
       * unprompted is itself the signal being observed (自発的再戦率).
       */
      #play-again {
        flex: none;
        margin-top: 12px;
        padding: 12px;
        font-size: 15px;
        font-weight: bold;
        font-family: inherit;
        border: 2px solid var(--bronze-dark);
        background: var(--bronze-mid);
        color: var(--parchment);
        -webkit-tap-highlight-color: transparent;
      }

      /*
       * A secondary action below the primary "もう一度遊ぶ" button — see
       * plan/0040-post-game-feedback.md / plan/0042-feedback-google-form.md.
       * Styled as an outline rather than a solid button so it doesn't
       * compete with the rematch button for attention; opens a Google Form
       * in a new tab (switched from a GitHub Issue — no account needed to
       * fill it out, unlike GitHub).
       */
      #feedback-link {
        flex: none;
        margin-top: 8px;
        padding: 10px;
        font-size: 13px;
        text-align: center;
        border: 2px solid var(--bronze-dark);
        color: var(--ink);
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
      }

      #rotate-warning {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: var(--stone-shadow);
        color: var(--parchment);
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }

      /*
       * Landscape is only a problem on a touchscreen (a phone rotated
       * sideways, with no mouse to fall back on) — see
       * plan/0039-pc-support.md. A mouse-driven device reports
       * `pointer: fine`, so a widescreen PC monitor never matches this and
       * never sees the warning, regardless of its aspect ratio.
       */
      @media (orientation: landscape) and (pointer: coarse) {
        #rotate-warning {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="world-select">
      <div id="world-select-title">ワールドを選択</div>
      <div id="world-select-premise">
        あなたはゼウスと人間の女性の間に生まれた青年。16人の神が、それぞれ3つの世界で待ち受ける。
      </div>
      <div id="world-select-levels"></div>
      <div id="world-select-list"></div>
      <div id="world-select-password-row">
        <input type="text" id="world-select-password" placeholder="パスワード" autocomplete="off" />
        <button type="button" id="world-select-password-submit">進む</button>
      </div>
      <div id="world-select-password-error" class="hidden">そのパスワードは無効です</div>
    </div>

    <div id="tutorial-hint">
      まずは自分の民（丸いマーク）の周りをタップして地形を平らにしよう。家が育ち、人口とマナが増えていく。長押ししてなぞると、まとめて地形を編集できる。
    </div>

    <div id="match-record" class="hidden">
      <div id="match-record-title"></div>
      <div id="match-record-list"></div>
      <button type="button" id="play-again">もう一度遊ぶ</button>
      <a
        id="feedback-link"
        href="https://docs.google.com/forms/d/e/1FAIpQLSeGDJIs11gUB318xUwt69QTIg9ddeeMeETtxvnw9RgPRn0Mmg/viewform"
        target="_blank"
        rel="noopener"
        >フィードバックを送る</a
      >
    </div>

    <div id="command-panel">
      <div id="panel-message"></div>
      <div id="status-row">
        <div class="status-item">
          <canvas class="status-icon" id="mana-status-icon"></canvas>
          <div class="status-bar-track"><div id="mana-bar-fill" style="width: 0%"></div></div>
          <span class="status-value" id="mana-value">0</span>
        </div>
        <!--
          The population comparison moved out of this row and onto the map
          itself, as the colonnade hanging opposite the overview map — see
          src/render/PopulationGauge.ts. Keeping a bar here as well would
          have said the same thing twice, and the row's remaining job (mana)
          is the one number that is genuinely a quantity rather than a
          standing.
        -->
      </div>
      <div id="toolbar">
        <div class="command-row">
          <button type="button" class="command-button" data-mode="settle" aria-pressed="true">定住</button>
          <button type="button" class="command-button" data-mode="gather">集結</button>
          <button type="button" class="command-button" data-mode="merge">合体</button>
          <button type="button" class="command-button" data-mode="goToShrine">集結地へ</button>
          <button type="button" class="command-button" data-mode="fight">戦闘</button>
          <button type="button" class="command-button" data-tool="sprog">スプログ</button>
          <button type="button" class="command-button" data-tool="rescue">救出</button>
          <button type="button" class="command-button" data-tool="inspect">照会</button>
        </div>
        <div class="command-row tool-group">
          <button type="button" class="command-button" aria-pressed="true" data-tool="raise">隆起</button>
          <button type="button" class="command-button" data-tool="lower">沈降</button>
          <button type="button" class="command-button" data-tool="flatten">平坦化</button>
          <button type="button" class="command-button" data-tool="autoFlatten">自動整地</button>
        </div>
        <!-- The original's own six schools of miracle — see src/ui/miracleCategories.ts. -->
        <div class="command-row category-row" id="miracle-categories">
          <button type="button" class="command-button category-button" aria-pressed="true" data-category="human">人</button>
          <button type="button" class="command-button category-button" data-category="plant">植物</button>
          <button type="button" class="command-button category-button" data-category="earth">地</button>
          <button type="button" class="command-button category-button" data-category="air">気</button>
          <button type="button" class="command-button category-button" data-category="fire">火</button>
          <button type="button" class="command-button category-button" data-category="water">水</button>
