<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a1a2a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" href="/icons/icon-192.png" />
    <title>game2</title>
    <style>
      html {
        /* Read in main.ts to keep the HUD/map clear of the status bar —
           installed standalone (viewport-fit=cover) it's the notch/status
           bar height; in an ordinary browser tab it's 0, since the
           browser's own chrome already occupies that space. */
        --safe-area-inset-top: env(safe-area-inset-top, 0px);
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a1a2a;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        font-family: system-ui, -apple-system, sans-serif;
      }

      #app {
        position: absolute;
        inset: 0;
      }

      /*
       * Capped height + its own scroll (rather than growing to fit every
       * row): the toolbar has picked up more sections over time (平坦化,
       * 敵地干渉 messaging, etc.) and, left unbounded, ate more and more of
       * the screen at the map's expense — per feedback: "メニューボタンが
       * 増えすぎて操作するマップ画面が小さいです". touch-action: pan-y
       * overrides the page-wide touch-action: none (see html, body above)
       * just for this element, so a vertical drag inside the toolbar
       * scrolls it instead of being swallowed as a map gesture.
       */
      #toolbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
        background: rgba(10, 26, 42, 0.88);
        box-sizing: border-box;
        max-height: 46vh;
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
      }

      /*
       * Two visually distinct button genres, per docs/game-system.md:
       * "行動方針" (behaviorMode) is a free, always-on standing order —
       * green. "奇跡" (miracles) are one-shot, mana-gated effects — blue.
       * First-time players otherwise have no way to tell the two apart,
       * since every button used to share one look.
       */
      .toolbar-section {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .toolbar-label {
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 0.05em;
        padding: 0 2px;
      }

      .toolbar-label .toolbar-label-note {
        font-size: 10px;
        font-weight: normal;
        letter-spacing: normal;
        color: #9db3c8;
      }

      [data-group="behavior"] .toolbar-label {
        color: #7be08a;
      }

      [data-group="tool"] .toolbar-label {
        color: #7cc0ff;
      }

      /* Population release is free like 行動方針, so it shares that green accent. */
      [data-group="population"] .toolbar-label {
        color: #7be08a;
      }

      [data-group="population"] button {
        border-color: #3fbf5e;
      }

      .toolbar-row {
        display: flex;
        gap: 6px;
      }

      .toolbar-row button {
        flex: 1;
        padding: 12px 4px;
        font-size: 14px;
        font-family: inherit;
        border: 1px solid #4fa8ff;
        border-radius: 8px;
        background: #123049;
        color: #fff;
        -webkit-tap-highlight-color: transparent;
      }

      .toolbar-row button[aria-pressed="true"] {
        background: #4fa8ff;
        color: #0a1a2a;
        font-weight: bold;
      }

      /*
       * A terrain-edit direction this match's TerrainEditRule forbids
       * (see world/heightmap.ts) — main.ts disables that button outright
       * rather than letting a tap silently do nothing.
       */
      .toolbar-row button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      /*
       * The player's current mana can't cover this button's cost right now
       * (main.ts's updateToolbarAffordability, re-evaluated every frame as
       * mana rises/falls) — dimmed but, unlike :disabled above, still
       * tappable: a tap still gives the clearer "マナが足りません" message,
       * and raise/lower must stay selectable even while unaffordable.
       */
      .toolbar-row button.mana-low {
        opacity: 0.55;
      }

      /* Behavior-mode buttons get the green accent instead of the default miracle blue. */
      [data-group="behavior"] button {
        border-color: #3fbf5e;
      }

      [data-group="behavior"] button[aria-pressed="true"] {
        background: #3fbf5e;
        color: #06210f;
      }

      /*
       * A one-time nudge toward the game's core loop — flatten the land
       * right around your own walkers/houses to grow them — since the
       * PIXI-canvas HUD is deliberately status-only (see Hud.ts) and
       * otherwise a first-time player has no in-game explanation of what
       * to do first. Positioned just above the toolbar; main.ts sets its
       * `bottom` alongside the map's own layout() so it never overlaps
       * the toolbar regardless of how many rows it wraps to.
       */
      #tutorial-hint {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: 320px;
        padding: 10px 14px;
        background: rgba(10, 26, 42, 0.92);
        border: 1px solid #4fa8ff;
        border-radius: 10px;
        color: #fff;
        font-size: 13px;
        line-height: 1.5;
        box-sizing: border-box;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.5s ease;
        z-index: 5;
      }

      #tutorial-hint.hidden {
        opacity: 0;
      }

      /*
       * A brief banner for enemy-cast miracles (see enemyMiracles.ts).
       * Once the enemy AI started acting on its own, anything it did
       * outside the player's current pan/zoom was otherwise completely
       * invisible — this at least says something happened, even if the
       * player has to check the minimap or pan over to see where.
       */
      #enemy-event-toast {
        position: fixed;
        top: calc(74px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        background: rgba(153, 32, 32, 0.92);
        border-radius: 999px;
        color: #fff;
        font-size: 13px;
        font-weight: bold;
        white-space: nowrap;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.5s ease;
        z-index: 6;
      }

      #enemy-event-toast.hidden {
        opacity: 0;
      }

      /*
       * 情報パネル (see docs/game-system.md 11節): tapping a walker/house
       * while the "🔍 照会" tool is selected (see main.ts's applyTool)
       * shows its population/strength/level here. Positioned like
       * #enemy-event-toast (a transient banner, not a persistent panel)
       * since it's meant to answer one question at a time, not stay
       * docked on screen.
       */
      #entity-info-panel {
        position: fixed;
        top: calc(74px + 40px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        background: rgba(10, 26, 42, 0.92);
        border: 1px solid #4fa8ff;
        border-radius: 999px;
        color: #fff;
        font-size: 13px;
        font-weight: bold;
        white-space: nowrap;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.5s ease;
        z-index: 6;
      }

      #entity-info-panel.hidden {
        opacity: 0;
      }

      /*
       * The post-game "戦いの記録" recap (see main.ts's showMatchRecord).
       * A PixiJS Text object (used for the rest of the HUD) can't scroll,
       * and a long match can produce more event lines than fit on
       * screen — an HTML overlay gets real scrolling for free. Shown
       * once, when the match ends; there's no way to dismiss it since
       * the match is over and nothing else happens after this.
       */
      /*
       * 征服モードの簡易版（docs/game-system.md 10節）: 500ワールドの
       * 進行やパスワード継続はまだ実装しないが、地形タイプ・マップサイズ・
       * 地形操作制限が異なる固定の少数ワールドから選ぶ最初の一歩として、
       * 起動直後に必ずこの画面を経由する。#match-recordと同じ
       * 「中央固定のスクロール可能パネル」構造を流用している。
       */
      #world-select {
        position: fixed;
        left: 10px;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        max-height: 80vh;
        display: flex;
        flex-direction: column;
        background: rgba(10, 26, 42, 0.95);
        border: 1px solid #4fa8ff;
        border-radius: 10px;
        padding: 14px;
        box-sizing: border-box;
        color: #fff;
        z-index: 9;
      }

      #world-select.hidden {
        display: none;
      }

      #world-select-title {
        flex: none;
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      #world-select-list {
        flex: 1 1 auto;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      #world-select-list button {
        padding: 12px;
        font-size: 14px;
        font-family: inherit;
        text-align: left;
        border: 1px solid #4fa8ff;
        border-radius: 8px;
        background: #123049;
        color: #fff;
        -webkit-tap-highlight-color: transparent;
      }

      #world-select-list button .world-select-name {
        display: block;
        font-weight: bold;
        margin-bottom: 2px;
      }

      #world-select-list button .world-select-detail {
        display: block;
        font-size: 12px;
        color: #9db3c8;
      }

      #world-select-list button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      /*
       * 征服モードのパスワード継続（docs/game-system.md 10節の
       * 「クリアするとパスワード（ワールド名）が与えられ、そこから
       * 再開できる」）: 前回クリアした際に表示されたパスワードを打ち込むと、
       * そこまでのワールドが選択可能になる。ローカルストレージ等での
       * 自動引き継ぎは行わない — 昔ながらの「紙に書き写して打ち込む」
       * パスワードそのものの体験を再現している。
       */
      #world-select-password-row {
        flex: none;
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }

      #world-select-password-row input {
        flex: 1 1 auto;
        min-width: 0;
        padding: 10px;
        font-size: 14px;
        font-family: inherit;
        border: 1px solid #4fa8ff;
        border-radius: 8px;
        background: #0a1a2a;
        color: #fff;
        box-sizing: border-box;
      }

      #world-select-password-row button {
        flex: none;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: bold;
        font-family: inherit;
        border: 1px solid #4fa8ff;
        border-radius: 8px;
        background: #4fa8ff;
        color: #0a1a2a;
        -webkit-tap-highlight-color: transparent;
      }

      #world-select-password-error {
        flex: none;
        margin-top: 6px;
        font-size: 12px;
        color: #ff8c8c;
      }

      #world-select-password-error.hidden {
        display: none;
      }

      #match-record {
        position: fixed;
        left: 10px;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        max-height: 70vh;
        display: flex;
        flex-direction: column;
        background: rgba(10, 26, 42, 0.95);
        border: 1px solid #4fa8ff;
        border-radius: 10px;
        padding: 14px;
        box-sizing: border-box;
        color: #fff;
        z-index: 8;
      }

      #match-record.hidden {
        display: none;
      }

      #match-record-title {
        flex: none;
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      #match-record-list {
        flex: 1 1 auto;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        /* Overrides the page-wide touch-action: none so a finger-drag here
           actually scrolls the list instead of being swallowed as a map gesture. */
        touch-action: pan-y;
        font-size: 13px;
        line-height: 1.7;
      }

      /*
       * Kept pinned below the (scrollable) event list rather than inside
       * it, so it's always visible without scrolling down — see
       * plan/0038-play-again.md. This button is deliberately left in place
       * with no other post-game screen: whether a player presses it
       * unprompted is itself the signal being observed (自発的再戦率).
       */
      #play-again {
        flex: none;
        margin-top: 12px;
        padding: 12px;
        font-size: 15px;
        font-weight: bold;
        font-family: inherit;
        border: 1px solid #4fa8ff;
        border-radius: 8px;
        background: #4fa8ff;
        color: #0a1a2a;
        -webkit-tap-highlight-color: transparent;
      }

      /*
       * A secondary action below the primary "もう一度遊ぶ" button — see
       * plan/0040-post-game-feedback.md / plan/0042-feedback-google-form.md.
       * Styled as an outline rather than a solid button so it doesn't
       * compete with the rematch button for attention; opens a Google Form
       * in a new tab (switched from a GitHub Issue — no account needed to
       * fill it out, unlike GitHub).
       */
      #feedback-link {
        flex: none;
        margin-top: 8px;
        padding: 10px;
        font-size: 13px;
        text-align: center;
        border: 1px solid #4fa8ff;
        border-radius: 8px;
        color: #7cc0ff;
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
      }

      #rotate-warning {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #0a1a2a;
        color: #fff;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }

      /*
       * Landscape is only a problem on a touchscreen (a phone rotated
       * sideways, with no mouse to fall back on) — see
       * plan/0039-pc-support.md. A mouse-driven device reports
       * `pointer: fine`, so a widescreen PC monitor never matches this and
       * never sees the warning, regardless of its aspect ratio.
       */
      @media (orientation: landscape) and (pointer: coarse) {
        #rotate-warning {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="world-select">
      <div id="world-select-title">ワールドを選択</div>
      <div id="world-select-list"></div>
      <div id="world-select-password-row">
        <input type="text" id="world-select-password" placeholder="パスワード" autocomplete="off" />
        <button type="button" id="world-select-password-submit">進む</button>
      </div>
      <div id="world-select-password-error" class="hidden">そのパスワードは無効です</div>
    </div>

    <div id="tutorial-hint">
      🙏 まずは自分の民（丸いマーク）の周りをタップして地形を平らにしよう。家が育ち、人口とマナが増えていく。長押ししてなぞると、まとめて地形を編集できる。
    </div>

    <div id="enemy-event-toast" class="hidden"></div>
    <div id="entity-info-panel" class="hidden"></div>

    <div id="match-record" class="hidden">
      <div id="match-record-title"></div>
      <div id="match-record-list"></div>
      <button type="button" id="play-again">もう一度遊ぶ</button>
      <a
        id="feedback-link"
        href="https://docs.google.com/forms/d/e/1FAIpQLSeGDJIs11gUB318xUwt69QTIg9ddeeMeETtxvnw9RgPRn0Mmg/viewform"
        target="_blank"
        rel="noopener"
        >📝 フィードバックを送る</a
      >
    </div>

    <div id="toolbar">
      <div class="toolbar-section" data-group="behavior">
        <div class="toolbar-label">
          行動方針 <span class="toolbar-label-note">常に有効・マナ消費なし</span>
        </div>
        <div class="toolbar-row">
          <button type="button" data-mode="settle" aria-pressed="true">定住</button>
          <button type="button" data-mode="gather">集結</button>
          <button type="button" data-mode="goToShrine">🚩 集結地へ</button>
          <button type="button" data-mode="fight">戦闘</button>
        </div>
      </div>
      <div class="toolbar-section" data-group="population">
        <div class="toolbar-label">
          人口 <span class="toolbar-label-note">マナ消費なし・出た民は本来より弱い</span>
        </div>
        <div class="toolbar-row">
          <button type="button" id="release-population">🚶 民を送り出す</button>
        </div>
      </div>
      <div class="toolbar-section" data-group="inspect">
        <div class="toolbar-label">
          情報 <span class="toolbar-label-note">タップしたウォーカー・家を照会・マナ消費なし</span>
        </div>
        <div class="toolbar-row">
          <button type="button" data-tool="inspect">🔍 照会</button>
        </div>
      </div>
      <div class="toolbar-section" data-group="tool">
        <div class="toolbar-label">
          奇跡 <span class="toolbar-label-note">タップで発動・マナを消費</span>
        </div>
        <div class="toolbar-row">
          <button type="button" data-tool="raise" aria-pressed="true">▲ 隆起</button>
          <button type="button" data-tool="lower">▼ 沈降</button>
          <button type="button" data-tool="flatten">◼ 平坦化</button>
          <button type="button" data-tool="shrine">🚩 集結地移動</button>
          <button type="button" data-tool="earthquake">💥 地震</button>
        </div>
        <div class="toolbar-row">
          <button type="button" data-tool="swamp">🐸 沼</button>
          <button type="button" data-tool="knight">⚔️ 騎士化</button>
          <button type="button" data-tool="guardian">🛡️ 守護者化</button>
          <button type="button" data-tool="volcano">🌋 火山</button>
          <button type="button" data-tool="flood">🌊 洪水</button>
        </div>
        <div class="toolbar-row">
          <button type="button" data-tool="armageddon">☠️ 最終決戦</button>
        </div>
      </div>
    </div>

    <div id="rotate-warning">
      <p>このゲームは縦持ちでご利用ください</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
